; Elden Combat - Poise & Stamina
; Elden Rim-style poise ("unbalance") rebuilt as a meter, shown on TrueHUD's special bar.
; Everything here can also be changed in-game: SKSE Menu Framework > Elden Combat > Poise & Stamina.
;
; Default balance (100 poise):
;   1H weapon = 3 hits, 2H weapon = 2 hits, a power attack counts double.
;   Poise refills 2.5 s after the last hit. Breaking poise = one stagger;
;   a blocking target gets guard-broken instead.

[Poise]
bEnablePoise = true
fBasePoise = 100
fPlayerPoise = 100
; how much extra poise taller creatures get (0 = none, 1 = twice as tall -> twice the poise)
fCreatureSizeScaling = 1
fMinSizeMult = 0.5
fMaxSizeMult = 5
; extra poise per unit of worn armor weight (0 = armor doesn't matter, like Elden Rim)
fArmorPoisePerWeight = 0
fRegenDelay = 2.5
fRegenPercentPerSec = 40
fBreakImmunity = 2
; cancel the game's own melee hit staggers so only poise breaks stagger (needs Precision)
bSuppressVanillaStagger = true

[Damage]
fDmgUnarmed = 20
fDmgDagger = 25
fDmgSword = 34
fDmgWarAxe = 34
fDmgMace = 40
fDmgGreatsword = 50
fDmgBattleaxe = 50
fDmgBow = 20
fDmgCrossbow = 34
fDmgStaff = 15
fDmgCreature = 34
fDmgBash = 40
fDmgSpell = 0
fPowerAttackMult = 2
fBlockedHitMult = 0.5
fPlayerToNPCMult = 1
fNPCToPlayerMult = 0.6
fNPCToNPCMult = 1

[Break]
; stagger size on break: ~0.25 small, 0.5 medium, 0.75 large, 1.0+ largest
fBreakMagLight = 0.75
fBreakMagHeavy = 1.25
fBreakMagPowerBonus = 0.25
fBreakMagOnPlayer = 0.5
bGuardBreak = true
fGuardBreakStaminaPct = 5
fGuardBreakMag = 1
; perfect block / ward parry also empties the attacker's poise (one stagger, one sound)
bPerfectBlockBreaksPoise = true

[HyperArmor]
; less poise damage while winding up or swinging a power attack (Elden Ring style)
bHyperArmor = true
fHyperArmorMult = 0.4
bHyperArmorPlayer = true
bHyperArmorNPC = true

[TrueHUD]
bTrueHUDBar = true
bTrueHUDPlayerBar = true
bFlashOnBreak = true
; recolor the poise bar: danger (close to breaking) and broken; colors are RRGGBB
bBarColors = true
fDangerPct = 35
bNormalColorDefault = true
sNormalColor = E0C068
sDangerColor = FF8C1A
sBrokenColor = E53935

[Stamina]
; Valhalla-style stamina add-on
bStaminaAddon = true
fCombatRegenMult = 1.5
fRegenDelayMult = 1
fLightHitRestorePct = 5
bLightHitRestorePlayer = true
bLightHitRestoreNPC = false

[Debug]
bDebug = false

[RaceOverrides]
; Plugin|FormID = poise multiplier, overrides the size-based creature poise
; Example: Skyrim.esm|0x00012345 = 3.0
